[package]
name = "gyra"
version = "0.1.0"
edition = "2024"

[dependencies]
glam = { version = "0.29.2", features = ["fast-math"] }
godot = { version = "0.2.2", features = ["experimental-threads"] }
gyra-net = { version = "0.1.0", path = "../gyra-net" }
log = "0.4.22"
thiserror = "2.0.9"

[lib]
crate-type = ["cdylib"]
